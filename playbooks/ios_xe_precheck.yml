# IOS-XE pre-check playbook
#
# Runs 10 read-only "show" commands on Cisco IOS-XE devices, saves the
# combined output to reports/<host>_<timestamp>.txt and prints a summary.
#
# Usage:
#   export IOSXE_USER=admin IOSXE_PASSWORD='...' IOSXE_ENABLE_PASSWORD='...'
#   ansible-playbook -i inventory/hosts.yml playbooks/ios_xe_precheck.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/ios_xe_precheck.yml -e precheck_fail_on_error=true
---
- name: IOS-XE pre-check - run 10 show commands
  hosts: ios_xe
  gather_facts: false
  connection: ansible.netcommon.network_cli

  vars:
    ansible_network_os: cisco.ios.ios
    ansible_become: true
    ansible_become_method: enable

    # The 10 pre-check commands (read-only)
    precheck_commands:
      - show version
      - show clock
      - show inventory
      - show ip interface brief
      - show interfaces description
      - show ip route summary
      - show processes cpu
      - show memory statistics
      - show logging
      - show ntp status

    # Set to true to fail the host when IOS-XE rejects any command
    precheck_fail_on_error: false

    precheck_report_dir: "{{ playbook_dir }}/../reports"
    precheck_error_regex: '% (Invalid input|Unknown command|Unrecognized command|Incomplete command|Ambiguous command)'

  tasks:
    - name: Run the 10 pre-check commands
      cisco.ios.ios_command:
        commands: "{{ precheck_commands }}"
      register: precheck

    - name: Count commands that IOS-XE rejected
      ansible.builtin.set_fact:
        precheck_error_count: "{{ precheck.stdout | select('match', '(?s).*' ~ precheck_error_regex) | list | length }}"

    - name: Ensure the report directory exists on the control node
      ansible.builtin.file:
        path: "{{ precheck_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write the report file on the control node
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/precheck_report.j2"
        dest: "{{ precheck_report_dir }}/{{ inventory_hostname }}_{{ lookup('pipe', 'date -u +%Y%m%d_%H%M%S') }}.txt"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Show pre-check summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Commands run: {{ precheck_commands | length }}"
          - "Commands rejected by IOS-XE: {{ precheck_error_count }}"
          - "Report: {{ precheck_report_dir }}"

    - name: Fail the host if any command was rejected and failing is enabled
      ansible.builtin.fail:
        msg: "{{ precheck_error_count }} pre-check command(s) were rejected on {{ inventory_hostname }}. Review the report."
      when:
        - precheck_fail_on_error | bool
        - precheck_error_count | int > 0
