# Example inventory for IOS-XE devices.
# Replace the hosts below with your own. Credentials are read from environment
# variables so no secrets are stored in this repository.
all:
  children:
    ios_xe:
      hosts:
        iosxe-rtr-01:
          ansible_host: 192.0.2.11
        iosxe-sw-01:
          ansible_host: 192.0.2.12
      vars:
        ansible_user: "{{ lookup('env', 'IOSXE_USER') }}"
        ansible_password: "{{ lookup('env', 'IOSXE_PASSWORD') }}"
        ansible_become_password: "{{ lookup('env', 'IOSXE_ENABLE_PASSWORD') }}"
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_command_timeout: 60
